name: Android - Build Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK Debug
        run: bash gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Guardar APK Debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SGM-Roteiro11-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
